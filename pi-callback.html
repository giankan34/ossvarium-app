<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pi Sign-In | OSSVARIUM</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="submission-box">

        <h2>☠ PI SIGN-IN ☠</h2>

        <div class="submission-text">

            <p id="loginStatus">
                Completing Pi authentication...
            </p>

        </div>

        <a class="submit-btn" href="index.html">
            ← RETURN TO OSSVARIUM
        </a>

    </div>

</div>

<script>

(async function () {

    const status = document.getElementById("loginStatus");

    const params =
        new URLSearchParams(window.location.hash.substring(1));

    const returnedState = params.get("state");
    const expectedState =
        sessionStorage.getItem("pi_oauth_state");

    sessionStorage.removeItem("pi_oauth_state");

    // Security check
    if (!expectedState || returnedState !== expectedState) {

        status.innerHTML =
            "Pi authentication failed.<br><br>Invalid security state.";

        history.replaceState(
            null,
            "",
            window.location.pathname
        );

        return;
    }

    const error = params.get("error");

    if (error) {

        status.innerHTML =
            "Pi authentication was not completed.<br><br>" +
            error;

        history.replaceState(
            null,
            "",
            window.location.pathname
        );

        return;
    }

    const accessToken = params.get("access_token");

    if (!accessToken) {

        status.innerHTML =
            "Pi authentication could not be completed.";

        return;
    }

    try {

        const response = await fetch(
            "https://api.minepi.com/v2/me",
            {
                headers: {
                    Authorization: `Bearer ${accessToken}`
                }
            }
        );

        if (!response.ok) {
            throw new Error("Unable to verify Pi identity.");
        }

        const user = await response.json();

        localStorage.setItem(
            "ossvariumPiUser",
            JSON.stringify({
                uid: user.uid,
                username: user.username
            })
        );

        status.innerHTML =
            `☠ PI IDENTITY VERIFIED ☠<br><br>
             Welcome, <strong>${user.username}</strong><br>
             to the OSSVARIUM archives.`;

    } catch (error) {

        console.error(error);

        status.innerHTML =
            "Pi identity verification failed.";

    }

    // Remove access token from browser URL
    history.replaceState(
        null,
        "",
        window.location.pathname
    );

})();

</script>

</body>
</html>
