<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<title>Initializing OSSVARIUM...</title>

<style>

html,body{

margin:0;
padding:0;
background:#050505;
overflow:hidden;

font-family:Courier New, monospace;

color:#d6b37d;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

}

#terminal{

width:600px;
max-width:90%;

}

.line{

opacity:0;

margin:14px 0;

font-size:20px;

letter-spacing:2px;

animation:fade .5s forwards;

}

@keyframes fade{

to{

opacity:1;

}

}

.final{

font-size:28px;

color:#e4c48f;

margin-top:40px;

text-align:center;

}

#progress-container{

width:320px;

height:10px;

border:1px solid #ff4d4d;

margin:35px auto;

background:#111;

overflow:hidden;

}

#progress-bar{

width:0%;

height:100%;

background:#ff4d4d;

box-shadow:0 0 15px #ff4d4d;

transition:width .5s linear;

}

</style>

<body>

<div id="terminal"></div>

<div id="progress-container">
    <div id="progress-bar"></div>
</div>

<script>

const lines = [

"INITIALIZING OSSVARIUM",
"",
"[█░░░░░░░░░░] 12%",
"",
"Loading Archives...",
"",
"[███░░░░░░░] 34%",
"",
"Scanning Relics...",
"",
"[██████░░░] 67%",
"",
"Authenticating Curator...",
"",
"[██████████] 100%",
"",
"Decrypting Vault...",
"",
"████ ACCESS GRANTED ████"

];

const terminal=document.getElementById("terminal");

let i=0;

function next(){

if(i<lines.length){

const div=document.createElement("div");

div.className="line";

div.style.animationDelay="0s";

div.innerText=lines[i];

const bar = document.getElementById("progress-bar");

bar.style.width = ((i+1)/lines.length)*100 + "%";

terminal.appendChild(div);

i++;

setTimeout(next,650);

}

else{

const done=document.createElement("div");

done.className="final";

done.innerHTML="████ ACCESS GRANTED ████";

terminal.appendChild(done);

setTimeout(()=>{

window.location="index.html";

},1800);

}

}

next();

</script>

</body>
</html>
