<!DOCTYPE html>
<html lang="el">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>OSSVARIUM STREAM</title>

<script src="https://sdk.minepi.com/pi-sdk.js"></script>

<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:#090707;
    background-image:
    radial-gradient(circle at top,#2a1111 0%,#090707 60%);

    color:#d3c7c7;

    font-family:'Courier New',monospace;

    overflow-x:hidden;

    padding:20px;

}

.container{

    max-width:460px;

    margin:auto;

    background:#120f0f;

    border:2px solid #2d2424;

    border-radius:18px;

    padding:20px;

    box-shadow:
    0 0 40px rgba(0,0,0,0.95),
    inset 0 0 20px rgba(255,0,0,0.03);

}

h1{

    font-family:'UnifrakturMaguntia',cursive;

    color:#d93030;

    font-size:38px;

    text-align:center;

    text-shadow:2px 2px #000;

}

.subtitle{

    text-align:center;

    margin-top:8px;

    margin-bottom:28px;

    color:#776868;

    font-size:11px;

    text-transform:uppercase;

    letter-spacing:2px;

}

.cover-wrapper{

    width:240px;

    height:240px;

    margin:0 auto 30px auto;

    border-radius:50%;

    background:
    radial-gradient(circle,#401515 0%,#110d0d 100%);

    border:4px solid #2c2323;

    display:flex;

    justify-content:center;

    align-items:center;

    animation:spin 18s linear infinite;

    box-shadow:
    0 0 30px #000,
    inset 0 0 40px #000;

}

@keyframes spin{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}

.cover-art{

    width:100%;
    height:100%;

}

.visualizer-box{

    background:
    linear-gradient(180deg,#211818 0%,#0d0a0a 100%);

    border:2px solid #312727;

    border-radius:12px;

    padding:16px;

    margin-bottom:20px;

}

.screen{

    background:#080707;

    border:1px solid #251d1d;

    padding:10px;

    border-radius:6px;

    color:#988686;

    text-align:center;

    margin-bottom:15px;

    font-size:11px;

    text-transform:uppercase;

}

canvas{

    width:100%;

    height:120px;

    background:#050404;

    border-radius:8px;

    border:1px solid #241b1b;

}

.controls{

    display:flex;

    justify-content:center;

    gap:10px;

    margin-top:15px;

}

.btn{

    background:
    linear-gradient(180deg,#382d2d 0%,#151111 100%);

    border:2px solid #483b3b;

    color:#fff;

    padding:10px 16px;

    border-radius:7px;

    cursor:pointer;

    font-weight:bold;

}

.btn-main{

    background:
    linear-gradient(180deg,#9d2323 0%,#470808 100%);

}

.release-list{

    margin-top:20px;

}

.release-card{

    background:
    linear-gradient(180deg,#1d1818 0%,#120f0f 100%);

    border:2px solid #2c2323;

    border-radius:12px;

    padding:16px;

    margin-bottom:15px;

}

.release-title{

    font-family:'UnifrakturMaguntia',cursive;

    color:#ff5555;

    font-size:24px;

    margin-bottom:10px;

}

.release-desc{

    font-size:12px;

    color:#9e8e8e;

    margin-bottom:15px;

    line-height:1.5;

}

.badge{

    display:inline-block;

    padding:5px 10px;

    border-radius:5px;

    font-size:10px;

    font-weight:bold;

    margin-bottom:15px;

}

.badge-free{

    background:#222;

    color:#aaa;

}

.badge-premium{

    background:#4a2222;

    color:#ffd966;

}

.unlock-box{

    margin-top:15px;

    padding:15px;

    border-radius:10px;

    border:2px solid #7b2424;

    background:
    linear-gradient(180deg,#651818 0%,#2a0808 100%);

    display:none;

}

.payment-status{

    margin-top:10px;

    font-size:12px;

    color:#fff;

}

.bandcamp-frame{

    margin-top:15px;

}

iframe{

    width:100%;

    border:0;

    border-radius:8px;

}

.footer{

    margin-top:25px;

    text-align:center;

    font-size:11px;

    color:#6f6262;

}

</style>

</head>

<body>

<div class="container">

<h1>OSSVARIUM</h1>

<div class="subtitle">
Underground Extreme Music Platform
</div>

<div class="cover-wrapper">

<svg class="cover-art" viewBox="0 0 100 100">

<circle cx="50" cy="50" r="46"
fill="none"
stroke="#8a2b2b"
stroke-width="2"
stroke-dasharray="3,3"/>

<circle cx="50" cy="50" r="40"
fill="none"
stroke="#6e2222"
stroke-width="1.5"/>

<path
d="M50 20 L50 80 M30 65 L70 65"
stroke="#b03838"
stroke-width="5"
fill="none"/>

</svg>

</div>

<div class="visualizer-box">

<div class="screen" id="screenText">
OSSVARIUM SYSTEM READY
</div>

<canvas id="visualizer"></canvas>

<div class="controls">

<button class="btn" onclick="toggleVisualizer()">
START VISUALIZER
</button>

</div>

</div>

<div class="release-list">

<!-- RELEASE 1 -->

<div class="release-card">

<div class="release-title">
Intro Ritual
</div>

<div class="release-desc">

Free demo stream for the OSSVARIUM underground archive.

</div>

<div class="badge badge-free">
FREE DEMO
</div>

<div class="bandcamp-frame">

<iframe
style="height:120px;"
src="https://bandcamp.com/EmbeddedPlayer/album=0000000000/size=large/bgcol=111111/linkcol=e32c2c/transparent=true/"
seamless>
</iframe>

</div>

</div>

<!-- RELEASE 2 -->

<div class="release-card">

<div class="release-title">
Cyber Necrosis
</div>

<div class="release-desc">

Premium underground release unlocked through Pi Testnet payment.

</div>

<div id="premiumBadge" class="badge badge-premium">
🔒 0.1 TEST PI
</div>

<button class="btn btn-main" onclick="openUnlock()">
UNLOCK RELEASE
</button>

<div id="unlockBox" class="unlock-box">

<button class="btn btn-main" onclick="triggerPiPayment()">
PAY WITH TEST PI
</button>

<div id="paymentStatus" class="payment-status"></div>

</div>

<div
id="premiumPlayer"
class="bandcamp-frame"
style="display:none;">

<iframe
style="height:120px;"
src="https://bandcamp.com/EmbeddedPlayer/album=0000000000/size=large/bgcol=111111/linkcol=e32c2c/transparent=true/"
seamless>
</iframe>

</div>

</div>

</div>

<div class="footer">

Powered by Pi • Bandcamp • OSSVARIUM

</div>

</div>

<script>

Pi.init({

    version:"2.0",

    sandbox:true,

    appId:"ossvarium-ed737fc4fd8ffa85"

});

const screenText =
document.getElementById("screenText");

const paymentStatus =
document.getElementById("paymentStatus");

const unlockBox =
document.getElementById("unlockBox");

const premiumPlayer =
document.getElementById("premiumPlayer");

const premiumBadge =
document.getElementById("premiumBadge");

function openUnlock(){

    unlockBox.style.display = "block";

}

if(localStorage.getItem("ossvarium_paid") === "true"){

    premiumPlayer.style.display = "block";

    premiumBadge.innerText = "UNLOCKED";

    premiumBadge.style.background = "#1d6b1d";

}

async function triggerPiPayment(){

    try{

        paymentStatus.innerText =
        "AUTHENTICATING...";

        const scopes = ['payments'];

        await Pi.authenticate(
            scopes,
            function(payment){
                console.log(payment);
            }
        );

        paymentStatus.innerText =
        "OPENING PAYMENT...";

        await Pi.createPayment({

            amount:0.1,

            memo:"Unlock OSSVARIUM Release",

            metadata:{
                type:"premium_unlock"
            }

        },{

            onReadyForServerApproval:
            async function(paymentId){

                paymentStatus.innerText =
                "APPROVING PAYMENT...";

                await fetch(
                    '/api/approve-payment',
                    {

                        method:'POST',

                        headers:{
                            'Content-Type':
                            'application/json'
                        },

                        body:JSON.stringify({
                            paymentId
                        })

                    }
                );

            },

            onReadyForServerCompletion:
            async function(paymentId,txid){

                paymentStatus.innerText =
                "COMPLETING PAYMENT...";

                await fetch(
                    '/api/complete-payment',
                    {

                        method:'POST',

                        headers:{
                            'Content-Type':
                            'application/json'
                        },

                        body:JSON.stringify({
                            paymentId,
                            txid
                        })

                    }
                );

                localStorage.setItem(
                    "ossvarium_paid",
                    "true"
                );

                paymentStatus.innerText =
                "UNLOCK SUCCESS";

                premiumPlayer.style.display =
                "block";

                premiumBadge.innerText =
                "UNLOCKED";

                premiumBadge.style.background =
                "#1d6b1d";

                unlockBox.style.display =
                "none";

            },

            onCancel:function(paymentId){

                paymentStatus.innerText =
                "PAYMENT CANCELLED";

            },

            onError:function(error,paymentId){

                console.error(error);

                paymentStatus.innerText =
                "ERROR";

            }

        });

    }catch(error){

        console.error(error);

        paymentStatus.innerText =
        "AUTH FAILED";

    }

}

const canvas =
document.getElementById("visualizer");

const ctx =
canvas.getContext("2d");

canvas.width = 400;
canvas.height = 120;

let running = false;

function drawVisualizer(){

    if(!running) return;

    requestAnimationFrame(drawVisualizer);

    ctx.clearRect(0,0,canvas.width,canvas.height);

    for(let i=0;i<40;i++){

        const height =
        Math.random() * 100;

        const x = i * 10;

        ctx.fillStyle =
        `rgb(${150 + Math.random()*100},30,30)`;

        ctx.fillRect(
            x,
            canvas.height - height,
            6,
            height
        );

    }

}

function toggleVisualizer(){

    running = !running;

    if(running){

        screenText.innerText =
        "SIGNAL DETECTED";

        drawVisualizer();

    }else{

        screenText.innerText =
        "SYSTEM READY";

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

    }

}

</script>

</body>
</html>
