<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSSVARIUM STREAM</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        /* 🎚️ Κεντρικό Industrial Background */
        body { 
            background-color: #0f0e0e; 
            background-image: radial-gradient(circle, #1a1616 0%, #080707 100%);
            color: #b5abab; 
            font-family: 'Courier New', Courier, monospace; 
            text-align: center; 
            padding: 15px;
            margin: 0;
        }
        
        /* 📱 Main App Container (Στυλ Κινητού) */
        .container { 
            max-width: 410px; 
            margin: 10px auto; 
            background: #141111; 
            padding: 20px; 
            border-radius: 12px; 
            border: 4px solid #241e1e; 
            box-shadow: 0 0 35px rgba(0,0,0,0.95);
        }

        /* 🤘 Ossvarium Custom Τίτλοι */
        h1 { 
            color: #d12323; 
            margin: 10px 0 2px 0; 
            letter-spacing: 5px; 
            font-size: 26px;
            text-shadow: 2px 2px 4px #000, 0 0 10px rgba(209,35,35,0.3);
            font-weight: 900;
        }
        .subtitle { 
            color: #5e5252; 
            font-size: 10px; 
            margin-bottom: 25px; 
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        
        /* 💿 ΑΝΑΓΛΥΦΟ ΧΑΛΚΙΝΟ EMBLEM (Cover Art) */
        .cover-wrapper {
            width: 210px;
            height: 210px;
            margin: 0 auto 30px auto;
            border: 5px solid #2e2424;
            border-radius: 50%;
            box-shadow: 0 10px 20px #000, inset 0 0 25px #000;
            background: radial-gradient(circle, #3d1c1c 0%, #170f0f 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        /* High-quality Evil Skull Emblem */
        .cover-art {
            width: 85%;
            height: 85%;
            object-fit: contain;
            filter: drop-shadow(0px 4px 6px #000);
        }

        /* 🎛️ ΜΕΤΑΛΛΙΚΟ ΠΛΑΙΣΙΟ ΧΕΙΡΙΣΤΗΡΙΟΥ (Με βίδες) */
        .controls-box {
            background: linear-gradient(180deg, #2b2525 0%, #171414 100%);
            padding: 20px 15px;
            border: 2px solid #3d3333;
            border-radius: 6px;
            margin-bottom: 22px;
            box-shadow: inset 0 1px 3px rgba(255,255,255,0.1), 0 8px 16px rgba(0,0,0,0.6);
            position: relative;
        }
        /* Προσομοίωση Βιδών στις γωνίες */
        .controls-box::before, .controls-box::after {
            content: '•';
            position: absolute;
            color: #4a3e3e;
            font-size: 16px;
            text-shadow: 1px 1px #000;
        }
        .controls-box::before { top: 2px; left: 6px; }
        .controls-box::after { bottom: 2px; right: 6px; }

        /* Οθόνη Τίτλου Κομματιού */
        .screen-display {
            background: #0d0b0b;
            border: 1px solid #241e1e;
            padding: 8px;
            border-radius: 4px;
            font-size: 11px;
            color: #a39595;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: inset 0 2px 5px #000;
        }

        /* Κουμπιά Αναπαραγωγής */
        .control-btns {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }
        .btn-custom {
            background: linear-gradient(180deg, #3d3434 0%, #1f1a1a 100%);
            border: 2px solid #4f4242;
            border-radius: 5px;
            color: #b82a2a;
            padding: 10px 18px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 4px 0 #0f0d0d, 0 4px 8px rgba(0,0,0,0.5);
        }
        .btn-custom:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #0f0d0d;
        }
        .btn-play {
            background: linear-gradient(180deg, #8a1c1c 0%, #420b0b 100%);
            border-color: #ad2626;
            color: #fff;
            padding: 10px 28px;
            text-shadow: 1px 1px 2px #000;
        }

        /* Μπάρα Προόδου */
        .progress-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 11px;
            color: #6e6262;
        }
        .progress-bar {
            flex-grow: 1;
            appearance: none;
            background: #0a0909;
            height: 6px;
            border-radius: 3px;
            outline: none;
            box-shadow: inset 0 1px 3px #000;
        }
        .progress-bar::-webkit-slider-thumb {
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: linear-gradient(180deg, #e62e2e 0%, #801111 100%);
            box-shadow: 0 0 6px #ff1a1a, 0 2px 4px #000;
            cursor: pointer;
        }

        /* 🎶 ΜΕΤΑΛΛΙΚΗ ΛΙΣΤΑ ΚΟΜΜΑΤΙΩΝ */
        .track-list { 
            text-align: left; 
            list-style: none; 
            padding: 0; 
            margin: 20px 0; 
        }
        .track-item { 
            padding: 14px 12px; 
            border: 2px solid #292323;
            border-radius: 5px;
            background: linear-gradient(180deg, #211c1c 0%, #141111 100%);
            margin-bottom: 10px;
            cursor: pointer; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-size: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
            position: relative;
        }
        .track-item::before {
            content: '•'; position: absolute; left: 4px; top: 2px; color: #3b3333; font-size: 10px;
        }
        /* Active / Free Track Style */
        .track-item.active { 
            background: linear-gradient(180deg, #4d1818 0%, #240b0b 100%); 
            border-color: #bd2828; 
            color: #e63535;
            font-weight: bold; 
            box-shadow: 0 0 12px rgba(230,53,53,0.25);
        }
        .track-item.free-style {
            background: linear-gradient(180deg, #5c1b1b 0%, #2b0b0b 100%);
            border-color: #b52424;
            color: #fff;
        }
        
        /* Badges */
        .badge { 
            font-size: 10px; 
            padding: 5px 10px; 
            border-radius: 4px; 
            font-weight: bold; 
            letter-spacing: 1px;
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.1), 0 2px 4px rgba(0,0,0,0.5);
        }
        .badge-free { background: #262121; color: #a19494; border: 1px solid #3d3434; }
        .badge-locked { background: linear-gradient(180deg, #3d3434 0%, #1f1a1a 100%); color: #cca743; border: 1px solid #4f4242; }
        .badge-unlocked { background: linear-gradient(180deg, #2196F3 0%, #0D47A1 100%); color: #fff; }

        /* 🚨 ΠΟΡΤΟΚΑΛΙ/ΚΟΚΚΙΝΟ ΠΛΑΙΣΙΟ ΠΛΗΡΩΜΗΣ (Lovable Lock Screen) */
        .unlock-panel {
            background: linear-gradient(180deg, #8a1a1a 0%, #3d0a0a 100%);
            border: 2px solid #db2727;
            border-radius: 6px;
            padding: 16px;
            margin-top: 20px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.6), inset 0 1px 3px rgba(255,255,255,0.2);
            display: none; 
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .unlock-
