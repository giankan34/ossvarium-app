<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSSVARIUM STREAM</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        body { background-color: #111; color: #fff; font-family: sans-serif; text-align: center; padding: 40px 20px; }
        .container { max-width: 550px; margin: 0 auto; background: #1a1a1a; padding: 30px; border-radius: 15px; border: 1px solid #333; }
        h1 { color: #ff4444; margin-bottom: 5px; letter-spacing: 2px; }
        .subtitle { color: #888; font-size: 14px; margin-bottom: 25px; }
        .status { margin: 15px 0; font-weight: bold; color: #ff4444; font-size: 14px; }
        
        /* Custom Player Styles */
        .player-box { background: #222; padding: 20px; border-radius: 10px; border: 1px solid #444; margin-top: 20px; }
        audio { width: 100%; margin-bottom: 15px; }
        .track-list { text-align: left; list-style: none; padding: 0; margin: 0; }
        .track-item { padding: 12px; border-bottom: 1px solid #333; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
        .track-item:hover { background: #2a2a2a; }
        .track-item.active { background: #ff4444; color: #fff; font-weight: bold; }
        .track-name { font-size: 15px; }
        .badge { font-size: 12px; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
        .badge-free { background: #00ff00; color: #000; }
        .badge-locked { background: #555; color: #aaa; }
        .badge-unlocked { background: #00ffff; color: #000; }
    </style>
</head>
<body>

<div class="container">
    <h1>OSSVARIUM STREAM</h1>
    <div class="subtitle">Web3 Music Player for the Extreme Scene</div>
    
    <div id="auth-status" class="status"></div>
    
    <div class="player-box">
        <h3 id="now-playing" style="margin-top:0; color:#aaa;">Επιλέξτε κομμάτι...</h3>
        <audio id="audio-element" controls controlsList="nodownload"></audio>
        
        <ul class="track-list">
            <li class="track-item" onclick="playTrack(0)">
                <span class="track-name">1. Ossvarium - Intro (Demo)</span>
                <span class="badge badge-free">FREE</span>
            </li>
            <li id="track-1" class="track-item" onclick="playTrack(1)">
                <span class="track-name">2. Ossvarium - Cyber Necrosis</span>
                <span id="badge-1" class="badge badge-locked">🔒 0.1 PI</span>
            </li>
            <li id="track-2" class="track-item" onclick="playTrack(2)">
                <span class="track-name">3. Ossvarium - Ritual of Nocturnal Beats</span>
                <span id="badge-2" class="badge badge-locked">🔒 0.1 PI</span>
            </li>
        </ul>
    </div>
</div>

<script>
  // Αρχικοποίηση Pi SDK
  Pi.init({ version: "2.0", sandbox: false });

  // Μεταβλητή που κρατάει αν ο χρήστης έχει πληρώσει (Web3 State)
  let hasPaidAndUnlocked = false;

  // Η λίστα με τα MP3 σου (Εδώ στο μέλλον θα βάλεις τα δικά σου links)
  const playlist = [
    { name: "1. Ossvarium - Intro (Demo)", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3", isLocked: false },
    { name: "2. Ossvarium - Cyber Necrosis", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3", isLocked: true },
    { name: "3. Ossvarium - Ritual of Nocturnal Beats", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3", isLocked: true }
  ];

  const audio = document.getElementById('audio-element');
  const nowPlayingText = document.getElementById('now-playing');
  const statusDiv = document.getElementById('auth-status');

  function onIncompletePaymentFound(payment) {
    console.log("Incomplete payment found:", payment);
  }

  // Η βασική συνάρτηση του Player
  function playTrack(index) {
    const track = playlist[index];
    
    // Καθαρισμός προηγούμενων active classes
    document.querySelectorAll('.track-item').forEach((item, i) => {
        if(i === index) item.classList.add('active');
        else item.classList.remove('active');
    });

    // Έλεγχος αν το κομμάτι είναι κλειδωμένο και ο χρήστης ΔΕΝ έχει πληρώσει ακόμα
    if (track.isLocked && !hasPaidAndUnlocked) {
        audio.pause();
        statusDiv.style.color = "#ff4444";
        statusDiv.innerText = "🔒 Το κομμάτι είναι κλειδωμένο. Ξεκινάει πληρωμή 0.1 Pi...";
        
        // Καλούμε αυτόματα το Pi Wallet για πληρωμή!
        triggerPiPayment();
        return;
    }

    // Αν είναι free ή αν έχει ήδη ξεκλειδωθεί, παίζει κανονικά!
    audio.src = track.url;
    nowPlayingText.innerText = "Τώρα παίζει: " + track.name;
    audio.play();
    statusDiv.innerText = "";
  }

  // Η συνάρτηση πληρωμής που ήδη ξέρεις ότι δουλεύει άψογα!
  function triggerPiPayment() {
    Pi.authenticate(['username', 'payments'], onIncompletePaymentFound)
      .then(function(auth) {
        return Pi.createPayment({
          amount: 0.1,
          memo: "Ξεκλείδωμα Premium Κομματιών - Ossvarium",
          metadata: { orderId: "premium_unlock_all" }
        }, {
          onReadyForServerApproval: function(paymentId) {
            fetch(window.location.origin + '/api/approve-payment?v=' + new Date().getTime(), {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ paymentId: paymentId })
            })
            .then(res => res.json())
            .then(data => console.log("Server Approved!", data))
            .catch(err => { statusDiv.innerText = "Σφάλμα έγκρισης."; });
          },
          onReadyForServerCompletion: function(paymentId, txid) {
            fetch(window.location.origin + '/api/complete-payment?v=' + new Date().getTime(), {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ paymentId: paymentId, txid: txid })
            })
            .then(res => res.json())
            .then(data => {
              // ΕΔΩ ΓΙΝΕΤΑΙ Η ΜΑΓΕΙΑ ΤΟΥ Web3 ΞΕΚΛΕΙΔΩΜΑΤΟΣ:
              hasPaidAndUnlocked = true;
              
              statusDiv.style.color = "#00ff00";
              statusDiv.innerText = "✅ Η πληρωμή πέτυχε! Όλα τα κομμάτια ξεκλειδώθηκαν!";
              
              // Αλλάζουμε τα λουκέτα σε "UNLOCKED"
              document.getElementById('badge-1').className = "badge badge-unlocked";
              document.getElementById('badge-1').innerText = "🔓 UNLOCKED";
              document.getElementById('badge-2').className = "badge badge-unlocked";
              document.getElementById('badge-2').innerText = "🔓 UNLOCKED";
            })
            .catch(err => { statusDiv.innerText = "Σφάλμα ολοκλήρωσης."; });
          },
          onCancel: function(paymentId) { statusDiv.innerText = "Η πληρωμή ακυρώθηκε."; },
          onError: function(error, paymentId) { statusDiv.innerText = "Σφάλμα: " + error.message; }
        });
      })
      .catch(function(error) { statusDiv.innerText = "Αποτυχία σύνδεσης."; });
  }
</script>

</body>
</html>
