<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSSVARIUM STREAM</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        body { background-color: #111; color: #fff; font-family: sans-serif; text-align: center; padding: 40px 20px; }
        .container { max-width: 550px; margin: 0 auto; background: #1a1a1a; padding: 30px; border-radius: 15px; border: 1px solid #333; }
        h1 { color: #ff4444; margin-bottom: 5px; letter-spacing: 2px; }
        .subtitle { color: #888; font-size: 14px; margin-bottom: 25px; }
        .status { margin: 20px 0; font-weight: bold; color: #aaa; }
        .pi-btn { background-color: #ff4444; color: white; border: none; padding: 15px 30px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s; text-decoration: none; display: inline-block; }
        .pi-btn:hover { background-color: #cc3333; }
        .unlock-btn { background-color: #00ff00; color: #000; }
        .unlock-btn:hover { background-color: #00cc00; }
        .player-section { margin-top: 35px; padding-top: 25px; border-top: 1px solid #333; display: none; } /* Κρυφό αρχικά */
    </style>
</head>
<body>

<div class="container">
    <h1>OSSVARIUM STREAM</h1>
    <div class="subtitle">Web3 Music Player for the Extreme Scene</div>
    
    <div id="auth-status" class="status">Έτοιμο για σύνδεση & ακρόαση.</div>
    
    <button id="pay-button" class="pi-btn" onclick="startPiProcess()">EXECUTE PAYMENT (0.1 PI)</button>
    
    <div id="unlocked-section" class="player-section">
        <h3 style="color: #00ff00; letter-spacing: 1px;">🔓 ΚΟΜΜΑΤΙ ΞΕΚΛΕΙΔΩΘΗΚΕ!</h3>
        <p style="color: #ccc; font-size: 14px; margin-bottom: 20px;">Ο Pi Browser μπλοκάρει την αναπαραγωγή εντός της εφαρμογής. Πατήστε το παρακάτω κουμπί για να ακούσετε το άλμπουμ απευθείας στο Bandcamp:</p>
        <a href="https://ossvarium.bandcamp.com/album=1308388713" target="_blank" class="pi-btn unlock-btn">ΑΚΟΥΣΤΕ ΤΟ ΑΛΜΠΟΥΜ ΕΔΩ</a>
    </div>
</div>

<script>
  Pi.init({ version: "2.0", sandbox: false });

  function onIncompletePaymentFound(payment) {
    console.log("Incomplete payment found:", payment);
  }

  function startPiProcess() {
    const statusDiv = document.getElementById('auth-status');
    const payButton = document.getElementById('pay-button');
    const unlockedSection = document.getElementById('unlocked-section');
    
    statusDiv.innerText = "Γίνεται επικοινωνία με το Pi Wallet...";
    
    Pi.authenticate(['username', 'payments'], onIncompletePaymentFound)
      .then(function(auth) {
        statusDiv.innerText = "Έναρξη πληρωμής...";
        
        return Pi.createPayment({
          amount: 0.1,
          memo: "Υποστήριξη μπάντας στο Ossvarium Stream",
          metadata: { orderId: "12345" }
        }, {
          onReadyForServerApproval: function(paymentId) {
            statusDiv.innerText = "Ο Server εγκρίνει την πληρωμή...";
            
            fetch(window.location.origin + '/api/approve-payment?v=' + new Date().getTime(), {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ paymentId: paymentId })
            })
            .then(res => {
              if (!res.ok) throw new Error('Server returned ' + res.status);
              return res.json();
            })
            .then(data => {
              console.log("Server Approved!", data);
            })
            .catch(err => {
              console.error(err);
              statusDiv.innerText = "Σφάλμα έγκρισης server.";
            });
          },
          onReadyForServerCompletion: function(paymentId, txid) {
            statusDiv.innerText = "Ολοκλήρωση στο Blockchain...";
            
            fetch(window.location.origin + '/api/complete-payment?v=' + new Date().getTime(), {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ paymentId: paymentId, txid: txid })
            })
            .then(res => {
              if (!res.ok) throw new Error('Server returned ' + res.status);
              return res.json();
            })
            .then(data => {
              console.log("Payment Completed Successfully!", data);
              
              // 1. Ενημέρωση κειμένου κατάστασης
              statusDiv.innerHTML = "<span style='color: #00ff00;'>Η πληρωμή ολοκληρώθηκε επιτυχώς!</span>";
              
              // 2. Εξαφάνιση του κουμπιού πληρωμής
              payButton.style.display = "none";
              
              // 3. Εμφάνιση του Unlocked Section με το κουμπί συνδέσμου
              unlockedSection.style.display = "block";
            })
            .catch(err => {
              console.error(err);
              statusDiv.innerText = "Σφάλμα ολοκλήρωσης πληρωμής.";
            });
          },
          onCancel: function(paymentId) {
            statusDiv.innerText = "Η πληρωμή ακυρώθηκε.";
          },
          onError: function(error, paymentId) {
            statusDiv.innerText = "Σφάλμα: " + error.message;
          }
        });
      })
      .catch(function(error) {
        console.error(error);
        statusDiv.innerText = "Αποτυχία ταυτοποίησης χρήστη.";
      });
  }
</script>

</body>
</html>
