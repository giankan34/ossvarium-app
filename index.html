<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSSVARIUM STREAM</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&display=swap" rel="stylesheet">
    <style>
        /* Τα υπάρχοντα styles σου παραμένουν ίδια */
        body { background-color: #121010; background-image: radial-gradient(circle, #1c1818 0%, #0a0909 100%); color: #a89f9f; font-family: 'Courier New', Courier, monospace; text-align: center; padding: 15px; margin: 0; }
        .container { max-width: 400px; margin: 10px auto; background: #171414; padding: 20px; border-radius: 8px; border: 3px solid #2b2424; box-shadow: 0 0 30px rgba(0,0,0,0.9); }
        h1 { color: #cc2525; font-family: 'UnifrakturMaguntia', cursive; margin: 5px 0 2px 0; letter-spacing: 2px; font-size: 34px; text-shadow: 2px 2px #000; font-weight: 900; }
        .subtitle { color: #544b4b; font-size: 10px; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px; }
        .controls-box { background: linear-gradient(180deg, #2b2424 0%, #141111 100%); padding: 15px; border: 2px solid #3b3131; border-radius: 6px; margin-bottom: 20px; position: relative; }
        .btn-custom { background: linear-gradient(180deg, #3b3232 0%, #1c1717 100%); border: 2px solid #4a3e3e; border-radius: 4px; color: #cc2525; padding: 8px 16px; cursor: pointer; font-weight: bold; }
        /* Νέο style για το Bandcamp */
        #bandcamp-embed { margin-top: 15px; border-top: 1px solid #333; padding-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>OSSVARIUM STREAM</h1>
    <div class="subtitle">Web3 Music Player for the Extreme Scene</div>

    <div class="controls-box">
        <div id="now-playing" class="screen-display">ΕΠΙΛΕΞΤΕ ΚΟΜΜΑΤΙ...</div>
        <div class="control-btns">
            <button class="btn-custom" onclick="changeTrack(-1)">⏮</button>
            <button class="btn-custom" onclick="togglePlay()">▶ / ⏸</button>
            <button class="btn-custom" onclick="changeTrack(1)">⏭</button>
        </div>
    </div>

    <div class="controls-box">
        <div class="screen-display">BANDCAMP STREAMING</div>
        <input type="text" id="bandcampUrl" placeholder="Paste Bandcamp Album URL..." style="width: 80%; background: #0a0909; border: 1px solid #3b3131; color: #fff; padding: 5px; margin-bottom: 10px;">
        <button class="btn-custom" onclick="loadBandcamp()">LOAD</button>
        <div id="bandcamp-embed"></div>
    </div>
</div>

<script>
  // Η υπάρχουσα λογική σου...
  
  // Προσθήκη της νέας συνάρτησης Bandcamp
  function loadBandcamp() {
    const url = document.getElementById('bandcampUrl').value;
    const embedDiv = document.getElementById('bandcamp-embed');
    const albumId = url.match(/\/album\/(\d+)/)?.[1];
    
    if (albumId) {
        embedDiv.innerHTML = `<iframe style="border: 0; width: 100%; height: 120px;" src="https://bandcamp.com/EmbeddedPlayer/album=${albumId}/size=large/bgcol=1a1a1a/linkcol=cc2525/transparent=true/" seamless></iframe>`;
    } else {
        alert("Λάθος link. Πρέπει να είναι link άλμπουμ.");
    }
  }
</script>
</body>
</html>
