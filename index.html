<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSSVARIUM STREAM</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        body { 
            background-color: #0b0b0b; 
            color: #e0e0e0; 
            font-family: 'Courier New', Courier, monospace; 
            text-align: center; 
            padding: 20px;
            margin: 0;
        }
        .container { 
            max-width: 480px; 
            margin: 0 auto; 
            background: #121212; 
            padding: 25px; 
            border-radius: 4px; 
            border: 2px solid #282828; 
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        h1 { 
            color: #ff3333; 
            margin-bottom: 5px; 
            letter-spacing: 3px; 
            font-size: 26px;
            text-shadow: 2px 2px #000;
        }
        .subtitle { 
            color: #666; 
            font-size: 11px; 
            margin-bottom: 20px; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        /* Cover Art Section */
        .cover-wrapper {
            width: 220px;
            height: 220px;
            margin: 0 auto 20px auto;
            border: 3px solid #1a1a1a;
            box-shadow: inset 0 0 10px #000;
            background: #151515;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .cover-art {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Track List Style */
        .track-list { 
            text-align: left; 
            list-style: none; 
            padding: 0; 
            margin: 20px 0; 
        }
        .track-item { 
            padding: 14px 12px; 
            border: 1px solid #1f1f1f;
            background: #161616;
            margin-bottom: 6px;
            cursor: pointer; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-size: 13px;
        }
        .track-item:hover { 
            background: #1c1c1c; 
            border-color: #333;
        }
        .track-item.active { 
            background: #251111; 
            border-color: #ff3333; 
            color: #ff3333;
            font-weight: bold; 
        }
        .badge { 
            font-size: 10px; 
            padding: 3px 6px; 
            border-radius: 2px; 
            font-weight: bold; 
            letter-spacing: 1px;
        }
        .badge-free { background: #222; color: #888; border: 1px solid #333; }
        .badge-locked { background: #ff3333; color: #fff; }
        .badge-unlocked { background: #00ff00; color: #000; }

        /* Custom Audio Controls */
        .controls-box {
            background: #181818;
            padding: 15px;
            border: 1px solid #222;
            margin-bottom: 20px;
        }
        .control-btns {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 15px;
        }
        .btn-custom {
            background: #222;
            border: 1px solid #444;
            color: #ff3333;
            padding: 10px 20px;
            cursor: pointer;
            font-weight: bold;
            font-family: monospace;
            text-transform: uppercase;
            font-size: 12px;
        }
        .btn-custom:hover {
            background: #ff3333;
            color: #fff;
            border-color: #ff3333;
        }
        
        /* Custom Progress Bar */
        .progress-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 11px;
            color: #666;
        }
        .progress-bar {
            flex-grow: 1;
            appearance: none;
            background: #292929;
            height: 6px;
            outline: none;
            cursor: pointer;
        }
        .progress-bar::-webkit-slider-thumb {
            appearance: none;
            width: 12px;
            height: 12px;
            background: #ff3333;
            cursor: pointer;
        }

        /* Industrial Unlock Panel */
        .unlock-panel {
            background: linear-gradient(180deg, #4a1111 0%, #250707 100%);
            border: 2px solid #ff3333;
            padding: 20px;
            margin-top: 15px;
            display: none; /* Εμφανίζεται μόνο στο κλείδωμα */
        }
        .unlock-title {
            color: #ff3333;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 14px;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        .unlock-desc {
            font-size: 11px;
            color: #bbb;
            margin-bottom: 15px;
        }
        .pay-btn {
            background: #ff3333;
            color: #fff;
            border: none;
            padding: 12px 24px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-family: monospace;
            box-shadow: 0 4px #990000;
        }
        .pay-btn:active {
            box-shadow: 0 1px #990000;
            transform: translateY(3px);
        }
        .status-text {
            font-size: 12px;
            color: #ff3333;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>OSSVARIUM STREAM</h1>
    <div class="subtitle">Web3 Music Player for the Extreme Scene</div>
    
    <div class="cover-wrapper">
        <img class="cover-art" src="https://i.imgur.com/83uXG7k.png" alt="Ossvarium Cover">
    </div>

    <div class="controls-box">
        <div id="now-playing" style="font-size: 12px; color: #888; margin-bottom: 10px;">ΠΑΤΗΣΤΕ PLAY...</div>
        <div class="control-btns">
            <button class="btn-custom" onclick="togglePlay()">Play / Pause</button>
        </div>
        <div class="progress-container">
            <span id="current-time">0:00</span>
            <input type="range" id="progress" class="progress-bar" value="0" max="100">
            <span id="duration">0:00</span>
        </div>
    </div>
    
    <ul class="track-list">
        <li class="track-item" id="item-0" onclick="selectTrack(0)">
            <span>1. Ossvarium - Intro (Demo)</span>
            <span class="badge badge-free">FREE</span>
        </li>
        <li class="track-item" id="item-1" onclick="selectTrack(1)">
            <span>2. Ossvarium - Cyber Necrosis</span>
            <span id="badge-1" class="badge badge-locked">🔒 0.1 PI</span>
        </li>
        <li class="track-item" id="item-2" onclick="selectTrack(2)">
            <span>3. Ossvarium - Ritual of Nocturnal Beats</span>
            <span id="badge-2" class="badge badge-locked">🔒 0.1 PI</span>
        </li>
    </ul>

    <div id="unlock-panel" class="unlock-panel">
        <div class="unlock-title">Activate Locked Track</div>
        <div id="unlock-desc" class="unlock-desc">UNLOCK 2. Ossvarium - Cyber Necrosis</div>
        <button class="pay-btn" onclick="triggerPiPayment()">Pay to Unlock (0.1 Pi)</button>
        <div id="auth-status" class="status-text"></div>
    </div>
</div>

<audio id="audio-element" controlsList="nodownload" style="display:none;"></audio>

<script>
  Pi.init({ version: "2.0", sandbox: false });

  let hasPaidAndUnlocked = false;
  let currentTrackIndex = null;

  const playlist = [
    { name: "1. Ossvarium - Intro (Demo)", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3", isLocked: false },
    { name: "2. Ossvarium - Cyber Necrosis", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3", isLocked: true },
    { name: "3. Ossvarium - Ritual of Nocturnal Beats", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3", isLocked: true }
  ];

  const audio = document.getElementById('audio-element');
  const progress = document.getElementById('progress');
  const currentTimeText = document.getElementById('current-time');
  const durationText = document.getElementById('duration');
  const nowPlayingText = document.getElementById('now-playing');
  const unlockPanel = document.getElementById('unlock-panel');
  const unlockDesc = document.getElementById('unlock-desc');
  const statusDiv = document.getElementById('auth-status');

  function onIncompletePaymentFound(payment) {
    console.log("Incomplete payment found:", payment);
  }

  function selectTrack(index) {
    currentTrackIndex = index;
    const track = playlist[index];
    
    document.querySelectorAll('.track-item').forEach((item, i) => {
        if(i === index) item.classList.add('active');
        else item.classList.remove('active');
    });

    if (track.isLocked && !hasPaidAndUnlocked) {
        audio.pause();
        unlockDesc.innerText = "UNLOCK " + track.name;
        unlockPanel.style.display = "block";
        nowPlayingText.innerText = "🔒 ΚΛΕΙΔΩΜΕΝΟ ΚΟΜΜΑΤΙ";
        return;
    }

    unlockPanel.style.display = "none";
    audio.src = track.url;
    nowPlayingText.innerText = "ΤΩΡΑ ΠΑΙΖΕΙ: " + track.name;
    audio.play();
  }

  function togglePlay() {
    if (currentTrackIndex === null) {
        selectTrack(0);
    } else {
        if (audio.paused) audio.play();
        else audio.pause();
    }
  }

  // Audio Player Listeners για την Custom Μπάρα
  audio.addEventListener('timeupdate', () => {
    if (audio.duration) {
        const pct = (audio.currentTime / audio.duration) * 100;
        progress.value = pct;
        
        let mins = Math.floor(audio.currentTime / 60);
        let secs = Math.floor(audio.currentTime % 60);
        if (secs < 10) secs = '0' + secs;
        currentTimeText.innerText = mins + ':' + secs;
    }
  });

  audio.addEventListener('loadedmetadata', () => {
    let mins = Math.floor(audio.duration / 60);
    let secs = Math.floor(audio.duration % 60);
    if (secs < 10) secs = '0' + secs;
    durationText.innerText = mins + ':' + secs;
  });

  progress.addEventListener('input', () => {
    if (audio.duration) {
        audio.currentTime = (progress.value / 100) * audio.duration;
    }
  });

  // Web3 Σύνδεση Πληρωμής
  function triggerPiPayment() {
    statusDiv.innerText = "ΕΠΙΚΟΙΝΩΝΙΑ ΜΕ PI WALLET...";
    
    Pi.authenticate(['username', 'payments'], onIncompletePaymentFound)
      .then(function(auth) {
        return Pi.createPayment({
          amount: 0.1,
          memo: "Ξεκλείδωμα Premium Κομματιών - Ossvarium",
          metadata: { orderId: "premium_unlock_all" }
        }, {
          onReadyForServerApproval: function(paymentId) {
            fetch(window.location.origin + '/api/approve-payment?v=' + new Date().getTime(), {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ paymentId: paymentId })
            }).then(res => res.json());
          },
          onReadyForServerCompletion: function(paymentId, txid) {
            fetch(window.location.origin + '/api/complete-payment?v=' + new Date().getTime(), {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ paymentId: paymentId, txid: txid })
            })
            .then(res => res.json())
            .then(data => {
              hasPaidAndUnlocked = true;
              unlockPanel.style.display = "none";
              
              document.getElementById('badge-1').className = "badge badge-unlocked";
              document.getElementById('badge-1').innerText = "🔓 UNLOCKED";
              document.getElementById('badge-2').className = "badge badge-unlocked";
              document.getElementById('badge-2').innerText = "🔓 UNLOCKED";
              
              selectTrack(currentTrackIndex);
            });
          },
          onCancel: function(paymentId) { statusDiv.innerText = "ΑΚΥΡΩΘΗΚΕ."; },
          onError: function(error, paymentId) { statusDiv.innerText = "ΣΦΑΛΜΑ."; }
        });
      })
      .catch(function(error) { statusDiv.innerText = "ΑΠΟΤΥΧΙΑ."; });
  }
</script>

</body>
</html>
