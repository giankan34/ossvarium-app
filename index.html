<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSSVARIUM STREAM</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&display=swap" rel="stylesheet">
    <style>
        /* 🎚️ Industrial Σκοτεινό Background */
        body { background-color: #121010; background-image: radial-gradient(circle, #1c1818 0%, #0a0909 100%); color: #a89f9f; font-family: 'Courier New', Courier, monospace; text-align: center; padding: 15px; margin: 0; }
        .container { max-width: 400px; margin: 10px auto; background: #171414; padding: 20px; border-radius: 8px; border: 3px solid #2b2424; box-shadow: 0 0 30px rgba(0,0,0,0.9); }
        h1 { color: #cc2525; font-family: 'UnifrakturMaguntia', cursive; margin: 5px 0 2px 0; letter-spacing: 2px; font-size: 34px; text-shadow: 2px 2px #000; font-weight: 900; }
        .subtitle { color: #544b4b; font-size: 10px; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px; }
        .cover-wrapper { width: 220px; height: 220px; margin: 0 auto 25px auto; border: 4px solid #262020; border-radius: 50%; box-shadow: 0 8px 20px #000, inset 0 0 20px #000; background: radial-gradient(circle, #2e1616 0%, #120d0d 100%); display: flex; align-items: center; justify-content: center; }
        .cover-art { width: 85%; height: 85%; filter: drop-shadow(0px 4px 8px #000); }
        .controls-box { background: linear-gradient(180deg, #2b2424 0%, #141111 100%); padding: 15px; border: 2px solid #3b3131; border-radius: 6px; margin-bottom: 20px; box-shadow: inset 0 1px 2px rgba(255,255,255,0.05), 0 6px 12px rgba(0,0,0,0.6); position: relative; }
        .controls-box::before { content: '• •'; position: absolute; top: 2px; left: 6px; right: 6px; display: flex; justify-content: space-between; color: #423838; font-size: 14px; }
        .controls-box::after { content: '• •'; position: absolute; bottom: 2px; left: 6px; right: 6px; display: flex; justify-content: space-between; color: #423838; font-size: 14px; }
        .screen-display { background: #0a0909; border: 1px solid #211b1b; padding: 8px; border-radius: 4px; font-size: 11px; color: #8c7e7e; margin-bottom: 15px; text-transform: uppercase; }
        
        /* Album Vault CSS */
        #album-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
        .album-card { cursor: pointer; border: 1px solid #3b3131; border-radius: 4px; padding: 5px; background: #141111; transition: 0.3s; }
        .album-card:hover { border-color: #cc2525; }
        .album-card img { width: 100%; border-radius: 2px; }
        .album-card div { font-size: 9px; color: #cc2525; margin-top: 5px; font-weight: bold; }

        .eq-container { display: none; justify-content: center; gap: 4px; height: 15px; align-items: flex-end; margin-bottom: 10px; }
        .bar { width: 4px; height: 3px; background: #cc2525; animation: bounce 0.8s infinite ease-in-out; }
        @keyframes bounce { 0%, 100% { height: 3px; } 50% { height: 15px; } }
        .bar:nth-child(2) { animation-delay: 0.15s; } .bar:nth-child(3) { animation-delay: 0.3s; } .bar:nth-child(4) { animation-delay: 0.45s; }
        .control-btns { display: flex; justify-content: center; gap: 12px; margin-bottom: 12px; }
        .btn-custom { background: linear-gradient(180deg, #3b3232 0%, #1c1717 100%); border: 2px solid #4a3e3e; border-radius: 4px; color: #cc2525; padding: 8px 16px; cursor: pointer; font-weight: bold; font-size: 14px; box-shadow: 0 3px 0 #000; }
        .btn-play { background: linear-gradient(180deg, #7a1818 0%, #3b0a0a 100%); border-color: #992222; color: #fff; padding: 8px 24px; }
        .progress-container { display: flex; align-items: center; gap: 10px; font-size: 11px; color: #5c5252; }
        .progress-bar { flex-grow: 1; appearance: none; background: #070606; height: 5px; border-radius: 3px; outline: none; }
        .track-list { text-align: left; list-style: none; padding: 0; margin: 20px 0; }
        .track-item { padding: 12px 10px; border: 2px solid #241f1f; border-radius: 4px; background: linear-gradient(180deg, #1f1a1a 0%, #141111 100%); margin-bottom: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-family: 'UnifrakturMaguntia', cursive; font-size: 18px; }
        .track-item.active { background: linear-gradient(180deg, #421515 0%, #210a0a 100%); border-color: #a82424; color: #e63535; }
        .badge { font-family: 'Courier New', monospace; font-size: 10px; padding: 4px 8px; border-radius: 3px; font-weight: bold; }
        .badge-free { background: #211c1c; color: #8c8080; }
        .badge-locked { background: linear-gradient(180deg, #332b2b 0%, #1a1515 100%); color: #d6af42; }
        .badge-unlocked { background: #1b5e20; color: #fff; }
        .unlock-panel { background: linear-gradient(180deg, #7a1515 0%, #330707 100%); border: 2px solid #cc2121; border-radius: 5px; padding: 14px; margin-top: 15px; display: none; }
        .pay-btn { background: linear-gradient(180deg, #261f1f 0%, #120f0f 100%); color: #fff; border: 2px solid #3b3232; padding: 8px 18px; cursor: pointer; font-weight: 900; }
    </style>
</head>
<body>

<div class="container">
    <h1>OSSVARIUM STREAM</h1>
    <div class="subtitle">Web3 Music Player</div>
    
    <div class="cover-wrapper">
        <svg class="cover-art" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="#8a2b2b" stroke-width="2" stroke-dasharray="3,3"/><path d="M50 20 L50 80 M30 65 L70 65" stroke="#b03838" stroke-width="5" stroke-linecap="square" fill="none"/></svg>
    </div>

    <div class="controls-box">
        <div class="eq-container" id="equalizer"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
        <div id="now-playing" class="screen-display">ΕΠΙΛΕΞΤΕ ΑΛΜΠΟΥΜ Η ΚΟΜΜΑΤΙ</div>
        <div class="control-btns">
            <button class="btn-custom" onclick="changeTrack(-1)">⏮</button>
            <button class="btn-custom btn-play" onclick="togglePlay()">▶ / ⏸</button>
            <button class="btn-custom" onclick="changeTrack(1)">⏭</button>
        </div>
        <div id="bandcamp-embed" style="margin-top: 15px;"></div>
    </div>

    <div class="controls-box">
        <div class="screen-display">ALBUM VAULT</div>
        <div id="album-grid"></div>
    </div>
    
    <ul class="track-list">
        <li class="track-item" id="item-0" onclick="selectTrack(0)"><span>1. Ossvarium - Intro</span><span class="badge badge-free">FREE</span></li>
        <li class="track-item" id="item-1" onclick="selectTrack(1)"><span>2. Ossvarium - Cyber Necrosis</span><span id="badge-1" class="badge badge-locked">🔒 0.1 PI</span></li>
        <li class="track-item" id="item-2" onclick="selectTrack(2)"><span>3. Ossvarium - Ritual</span><span id="badge-2" class="badge badge-locked">🔒 0.1 PI</span></li>
    </ul>

    <div id="unlock-panel" class="unlock-panel">
        <div class="unlock-flex"><div class="unlock-title">ACTIVATE LOCKED TRACK</div><button class="pay-btn" onclick="triggerPiPayment()">PAY 0.1 PI</button></div>
        <div id="auth-status" class="status-text"></div>
    </div>
</div>

<audio id="audio-element" style="display:none;"></audio>

<script>
    Pi.init({ version: "2.0", sandbox: false });

    // --- ALBUM VAULT CONFIG ---
    const myAlbums = [
        { title: "Demo Tape", id: "3742468307", cover: "https://f4.bcbits.com/img/a0123456789_16.jpg" },
        { title: "Dark Rituals", id: "123456789", cover: "https://f4.bcbits.com/img/a0987654321_16.jpg" }
    ];

    const grid = document.getElementById('album-grid');
    myAlbums.forEach(album => {
        const card = document.createElement('div');
        card.className = "album-card";
        card.innerHTML = `<img src="${album.cover}"><div>${album.title}</div>`;
        card.onclick = () => {
            document.getElementById('now-playing').innerText = "PLAYING: " + album.title;
            document.getElementById('bandcamp-embed').innerHTML = `<iframe style="border: 0; width: 100%; height: 120px;" src="https://bandcamp.com/EmbeddedPlayer/album=${album.id}/size=large/bgcol=1a1a1a/linkcol=cc2525/transparent=true/" seamless></iframe>`;
        };
        grid.appendChild(card);
    });

    // --- PI & TRACK LOGIC (ΑΠΟ ΤΟ ΑΡΧΕΙΟ ΣΟΥ) ---
    let hasPaidAndUnlocked = false;
    let currentTrackIndex = null;
    const playlist = [
        { name: "1. Ossvarium - Intro", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3", isLocked: false },
        { name: "2. Ossvarium - Cyber Necrosis", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3", isLocked: true },
        { name: "3. Ossvarium - Ritual", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3", isLocked: true }
    ];

    function selectTrack(index) {
        currentTrackIndex = index;
        const track = playlist[index];
        if (track.isLocked && !hasPaidAndUnlocked) {
            document.getElementById('unlock-panel').style.display = "block";
            return;
        }
        document.getElementById('audio-element').src = track.url;
        document.getElementById('audio-element').play();
    }

    function triggerPiPayment() {
        Pi.authenticate(['payments'], () => {}).then(auth => {
            return Pi.createPayment({ amount: 0.1, memo: "Unlock", metadata: {} }, {
                onReadyForServerCompletion: (pid, tx) => {
                    hasPaidAndUnlocked = true;
                    document.getElementById('unlock-panel').style.display = "none";
                    selectTrack(currentTrackIndex);
                }
            });
        });
    }
    function togglePlay() { const a = document.getElementById('audio-element'); a.paused ? a.play() : a.pause(); }
    function changeTrack(d) { selectTrack(currentTrackIndex + d); }
</script>
</body>
</html>
