<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OSSVARIUM STREAM</title>

<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:15px;
    background:#0b0909;
    background-image:radial-gradient(circle,#1d1515 0%,#080707 100%);
    color:#c4baba;
    font-family:'Courier New',monospace;
    text-align:center;
    overflow-x:hidden;
}

.container{
    max-width:430px;
    margin:auto;
    background:#151111;
    border:2px solid #2d2424;
    border-radius:14px;
    padding:20px;
    box-shadow:0 0 35px rgba(0,0,0,0.95);
}

h1{
    font-family:'UnifrakturMaguntia',cursive;
    color:#cf2c2c;
    font-size:36px;
    margin:0;
    text-shadow:2px 2px #000;
}

.subtitle{
    font-size:11px;
    color:#7b6969;
    margin-top:5px;
    margin-bottom:25px;
    text-transform:uppercase;
}

.cover-wrapper{
    width:240px;
    height:240px;
    margin:0 auto 25px auto;
    border-radius:50%;
    background:radial-gradient(circle,#391515 0%,#110d0d 100%);
    border:4px solid #2c2323;
    display:flex;
    align-items:center;
    justify-content:center;
    animation:rotateDisc 16s linear infinite;
    box-shadow:0 0 25px #000,inset 0 0 30px #000;
}

@keyframes rotateDisc{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

.cover-art{
    width:100%;
    height:100%;
}

.controls-box{
    background:linear-gradient(180deg,#231c1c 0%,#100d0d 100%);
    border:2px solid #352c2c;
    border-radius:10px;
    padding:15px;
    margin-bottom:20px;
}

.screen-display{
    background:#080707;
    border:1px solid #241d1d;
    padding:10px;
    border-radius:5px;
    color:#998585;
    margin-bottom:15px;
    font-size:11px;
    text-transform:uppercase;
}

.control-btns{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:15px;
}

.btn{
    background:linear-gradient(180deg,#3b3131 0%,#181313 100%);
    border:2px solid #473b3b;
    color:#fff;
    padding:10px 16px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

.btn-play{
    background:linear-gradient(180deg,#912020 0%,#490909 100%);
}

.progress-wrap{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:11px;
}

.progress{
    flex-grow:1;
}

.track-list{
    list-style:none;
    padding:0;
    margin:20px 0;
}

.track-item{
    background:linear-gradient(180deg,#1d1818 0%,#120f0f 100%);
    border:2px solid #292121;
    border-radius:8px;
    padding:12px;
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
    font-family:'UnifrakturMaguntia',cursive;
    font-size:18px;
}

.track-item.active{
    border-color:#b72828;
    color:#ff5050;
}

.badge{
    font-size:10px;
    font-family:monospace;
    padding:5px 8px;
    border-radius:4px;
    font-weight:bold;
}

.badge-free{
    background:#252020;
}

.badge-locked{
    background:#3a2c2c;
    color:#ffd24d;
}

.badge-unlocked{
    background:#185b18;
    color:#fff;
}

.unlock-panel{
    display:none;
    background:linear-gradient(180deg,#7a1818 0%,#310707 100%);
    border:2px solid #cf2a2a;
    border-radius:10px;
    padding:15px;
    margin-top:15px;
}

.pay-btn{
    background:#111;
    color:#fff;
    border:2px solid #433737;
    padding:10px 16px;
    border-radius:5px;
    cursor:pointer;
    margin:5px;
    font-weight:bold;
}

.eq{
    display:none;
    justify-content:center;
    gap:4px;
    height:18px;
    margin-bottom:12px;
    align-items:flex-end;
}

.bar{
    width:4px;
    height:4px;
    background:#cf2c2c;
    animation:bounce 0.7s infinite ease-in-out;
}

@keyframes bounce{
    0%,100%{height:4px;}
    50%{height:18px;}
}

.bar:nth-child(2){animation-delay:0.15s;}
.bar:nth-child(3){animation-delay:0.3s;}
.bar:nth-child(4){animation-delay:0.45s;}

.bandcamp-box{
    margin-top:20px;
}

input{
    width:100%;
    padding:10px;
    background:#0c0a0a;
    border:1px solid #332b2b;
    color:#fff;
    border-radius:5px;
    margin-bottom:10px;
}

iframe{
    width:100%;
    border:0;
}

@media(max-width:480px){

.track-item{
    flex-direction:column;
    align-items:flex-start;
}

h1{
    font-size:28px;
}

.cover-wrapper{
    width:200px;
    height:200px;
}

}

</style>
</head>
<body>

<div class="container">

<h1>OSSVARIUM STREAM</h1>
<div class="subtitle">Web3 Extreme Music Platform</div>

<div class="cover-wrapper">

<svg class="cover-art" viewBox="0 0 100 100">

<circle cx="50" cy="50" r="46" fill="none" stroke="#8a2b2b" stroke-width="2" stroke-dasharray="3,3"/>

<circle cx="50" cy="50" r="40" fill="none" stroke="#6e2222" stroke-width="1.5"/>

<path d="M50 20 L50 80 M30 65 L70 65" stroke="#b03838" stroke-width="5" fill="none"/>

</svg>

</div>

<div class="controls-box">

<div class="eq" id="eq">
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
</div>

<div class="screen-display" id="nowPlaying">
SELECT TRACK...
</div>

<div class="control-btns">
<button class="btn" onclick="prevTrack()">⏮</button>
<button class="btn btn-play" onclick="togglePlay()">▶ / ⏸</button>
<button class="btn" onclick="nextTrack()">⏭</button>
</div>

<div class="progress-wrap">
<span id="currentTime">0:00</span>
<input type="range" min="0" max="100" value="0" id="progress" class="progress">
<span id="duration">0:00</span>
</div>

</div>

<ul class="track-list">

<li class="track-item" onclick="selectTrack(0)">
<span>Intro Ritual</span>
<span class="badge badge-free">FREE</span>
</li>

<li class="track-item" onclick="selectTrack(1)">
<span>Cyber Necrosis</span>
<span id="badge1" class="badge badge-locked">🔒 0.1 PI</span>
</li>

<li class="track-item" onclick="selectTrack(2)">
<span>Nocturnal Beats</span>
<span id="badge2" class="badge badge-locked">🔒 NFT</span>
</li>

</ul>

<div id="unlockPanel" class="unlock-panel">

<div>
Premium Release Locked
</div>

<button class="pay-btn" onclick="triggerPiPayment()">
Unlock with Test Pi
</button>

<div id="paymentStatus" style="margin-top:10px;font-size:12px;"></div>

</div>

<div class="controls-box bandcamp-box">

<div class="screen-display">
BANDCAMP RELEASE
</div>

<input type="text" id="bcInput" placeholder="Paste Bandcamp Embed URL">

<button class="btn" onclick="loadBandcamp()" style="width:100%;">
LOAD BANDCAMP
</button>

<div id="bandcampContainer" style="margin-top:15px;"></div>

</div>

</div>

<audio id="audio"></audio>

<script>

Pi.init({
version:"2.0",
sandbox:true,
appId:"ossvarium-ed737fc4fd8ffa85"
});

const playlist = [
{
name:"Intro Ritual",
url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
locked:false
},
{
name:"Cyber Necrosis",
url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
locked:true
},
{
name:"Nocturnal Beats",
url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",
locked:true
}
];

let currentTrack = 0;
let unlocked = false;

const audio = document.getElementById("audio");
const progress = document.getElementById("progress");
const nowPlaying = document.getElementById("nowPlaying");
const eq = document.getElementById("eq");
const unlockPanel = document.getElementById("unlockPanel");
const paymentStatus = document.getElementById("paymentStatus");

function selectTrack(index){

currentTrack = index;

const track = playlist[index];

if(track.locked && !unlocked){

unlockPanel.style.display = "block";
nowPlaying.innerText = "LOCKED RELEASE";
return;

}

unlockPanel.style.display = "none";

nowPlaying.innerText = track.name;

audio.src = track.url;
audio.play();

eq.style.display = "flex";

}

function togglePlay(){

if(audio.paused){
audio.play();
eq.style.display = "flex";
}else{
audio.pause();
eq.style.display = "none";
}

}

function prevTrack(){
if(currentTrack > 0){
selectTrack(currentTrack - 1);
}
}

function nextTrack(){
if(currentTrack < playlist.length - 1){
selectTrack(currentTrack + 1);
}
}

progress.addEventListener("input",()=>{
if(audio.duration){
audio.currentTime = (progress.value / 100) * audio.duration;
}
});

audio.addEventListener("timeupdate",()=>{

if(audio.duration){

progress.value = (audio.currentTime / audio.duration) * 100;

let mins = Math.floor(audio.currentTime / 60);
let secs = Math.floor(audio.currentTime % 60);

if(secs < 10) secs = "0" + secs;

document.getElementById("currentTime").innerText = mins + ":" + secs;

}

});

audio.addEventListener("loadedmetadata",()=>{

let mins = Math.floor(audio.duration / 60);
let secs = Math.floor(audio.duration % 60);

if(secs < 10) secs = "0" + secs;

document.getElementById("duration").innerText = mins + ":" + secs;

});

function triggerPiPayment(){

paymentStatus.innerText = "CONNECTING TO TESTNET...";

Pi.authenticate(['payments'], function(){})
.then(function(){

setTimeout(()=>{

unlocked = true;

paymentStatus.innerText = "UNLOCK SUCCESSFUL";

unlockPanel.style.display = "none";

document.getElementById("badge1").className = "badge badge-unlocked";
document.getElementById("badge1").innerText = "UNLOCKED";

document.getElementById("badge2").className = "badge badge-unlocked";
document.getElementById("badge2").innerText = "NFT ACCESS";

selectTrack(currentTrack);

},1500);

})
.catch(function(){
paymentStatus.innerText = "AUTH FAILED";
});

}

function loadBandcamp(){

const url = document.getElementById("bcInput").value;

if(!url){
alert("Paste Bandcamp URL");
return;
}

const container = document.getElementById("bandcampContainer");

container.innerHTML = `
<iframe
style="height:120px;"
src="${url}"
seamless>
</iframe>
`;

}

</script>

</body>
</html>
