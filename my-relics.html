    sendCreatorCode.addEventListener(
    "click",
    async function () {
        const email =
            creatorEmail.value.trim();

        if (!email) {
            creatorEmailStatus.textContent =
                "ENTER YOUR CREATOR EMAIL";
            return;
        }

        try {
            sendCreatorCode.disabled = true;
            sendCreatorCode.textContent =
                "SENDING...";

            const response = await fetch(
                "/api/submit-relic",
                {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body: JSON.stringify({
                        action:
                            "send_email_verification",
                        email: email
                    })
                }
            );

            const result =
                await response.json();

            if (!response.ok) {
                throw new Error(
                    result.error ||
                    "COULD NOT SEND VERIFICATION CODE"
                );
            }

            creatorCodeSection.style.display =
                "block";

            creatorEmailStatus.textContent =

                "OSSVARIUM email verification error:",
                error

        } finally {
            sendCreatorCode.disabled = false;
            sendCreatorCode.textContent =
                "⚔ SEND VERIFICATION CODE";
        }
    }
);

verifyCreatorCode.addEventListener(

async function uploadCreatorTrackAudio(file) {

    if (!file) {
        throw new Error("Choose an MP3 file.");
    }

    if (
        file.type !== "audio/mpeg" &&
        !file.name.toLowerCase().endsWith(".mp3")
    ) {
        throw new Error(
            "Only MP3 files are allowed."
        );
    }

    const urlResponse =
        await fetch(
            "/api/audio-upload-url",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    fileName: file.name,
                    contentType: "audio/mpeg"
                })
            }
        );

    const urlResult =
        await urlResponse.json();

    if (!urlResponse.ok) {
        throw new Error(
            urlResult.error ||
            "Could not prepare private audio upload."
        );
    }

    const uploadResponse =
        await fetch(
            urlResult.uploadUrl,
            {
                method: "PUT",

                headers: {
                    "Content-Type":
                        "audio/mpeg"
                },

                body: file
            }
        );

    if (!uploadResponse.ok) {
        throw new Error(
            "Private MP3 upload failed."
        );
    }

    return urlResult.objectKey;
}

function escapeHtml(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

async function uploadImage(file) {
    if (!file) {
        return "";
    }

    const allowedTypes = [
        "image/jpeg",
        "image/png",
        "image/webp"
    ];

    if (!allowedTypes.includes(file.type)) {
        throw new Error(
            "Only JPEG, PNG and WEBP images are allowed."
        );
    }

    const urlResponse = await fetch(
        "/api/audio-upload-url",
        {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                fileName: file.name,
                contentType: file.type
            })
        }
    );

    const urlResult =
        await urlResponse.json();

    if (!urlResponse.ok) {
        throw new Error(
            urlResult.error ||
            "Could not prepare image upload."
        );
    }

    const uploadResponse = await fetch(
        urlResult.uploadUrl,
        {
            method: "PUT",

            headers: {
                "Content-Type": file.type
            },

            body: file
        }
    );

    if (!uploadResponse.ok) {
        throw new Error(
            "Image upload failed."
        );
    }

    return urlResult.objectKey;
}

                editor.querySelector(
                    ".add-track-download"
                ).checked;

            if (!title) {
                throw new Error(
                    "Track title is required."
                );
            }

            if (!audioFile) {
                throw new Error(
                    "Choose an MP3 file."
                );
            }

            if (
                !Number.isFinite(price) ||
                price < 0
            ) {
                throw new Error(
                    "Invalid track price."
                );
            }

            addTrackButton.disabled = true;
            addTrackStatus.textContent =
                "UPLOADING MP3...";

            const audio =
                await uploadCreatorTrackAudio(
                    audioFile
                );

            if (!Array.isArray(relic.tracks)) {
                relic.tracks = [];
            }

            relic.tracks.push({
                title: title,
                audio: audio,
                forSale: forSale,
                priceEur: price,
                allowDownload: allowDownload
            });

            addTrackStatus.textContent =
                "☠ TRACK READY — SAVE CHANGES";

            addTrackButton.disabled = true;

        } catch (error) {

            console.error(
                "OSSVARIUM add track error:",
                error
            );

            addTrackStatus.textContent =
                error.message ||
                "COULD NOT ADD TRACK";

            addTrackButton.disabled = false;
        }
    }
);

const saveButton =

    const removeTrackButtons =
    editor.querySelectorAll(".remove-track-btn");

removeTrackButtons.forEach(function (button) {
    button.addEventListener("click", function () {

        const trackIndex =
            Number(button.dataset.trackIndex);

        if (
            !Number.isInteger(trackIndex) ||
            !Array.isArray(relic.tracks) ||
            !relic.tracks[trackIndex]
        ) {
            return;
        }

        const trackTitle =
            relic.tracks[trackIndex].title ||
            `Track ${trackIndex + 1}`;

        const confirmed = confirm(
            `Remove "${trackTitle}" from this relic?`
        );

        if (!confirmed) {
            return;
        }

        relic.tracks.splice(trackIndex, 1);

        alert(
            '☠ TRACK REMOVED — PRESS "SAVE CHANGES" TO CONFIRM'
        );

        editButton.click();
        editButton.click();
    });
});
