<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>My Relics | OSSVARIUM</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=UnifrakturMaguntia&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="submission-page">

        <section class="submission-box">

            <h1>☠ MY RELICS ☠</h1>

            <p class="submission-text">
                Your creator archive within OSSVARIUM.
            </p>

            <button
                type="button"
                id="connectPiCreator"
                class="submit-btn">

                π CONNECT PI ACCOUNT

            </button>

            <div
                id="creatorStatus"
                class="submission-text">

                CONNECT YOUR PI ACCOUNT TO VIEW YOUR RELICS

            </div>

            <div id="myRelicsContainer"></div>

            <a
                href="index.html"
                class="back-link">

                ← RETURN TO OSSVARIUM

            </a>

        </section>

    </main>


    <script src="https://sdk.minepi.com/pi-sdk.js"></script>

    <script>

        Pi.init({
            version: "2.0"
        });

        let creatorPiAuth = null;

const connectButton =
    document.getElementById("connectPiCreator");

const creatorStatus =
    document.getElementById("creatorStatus");

const relicsContainer =
    document.getElementById("myRelicsContainer");


connectButton.addEventListener(
    "click",
    async function () {

        try {

            connectButton.disabled = true;
            connectButton.textContent =
                "π CONNECTING...";

            creatorPiAuth = await Pi.authenticate(
                ["username", "wallet_address"],
                function (payment) {
                    console.log(
                        "OSSVARIUM incomplete payment:",
                        payment
                    );
                }
            );

            creatorStatus.textContent =
                "π CONNECTED AS @" +
                creatorPiAuth.user.username;

            connectButton.textContent =
                "π PI ACCOUNT CONNECTED";

            await loadMyRelics();

        } catch (error) {

            console.error(
                "OSSVARIUM My Relics error:",
                error
            );

            creatorStatus.textContent =
                "COULD NOT LOAD YOUR RELICS";

            connectButton.disabled = false;
            connectButton.textContent =
                "π CONNECT PI ACCOUNT";
        }

    }
);


async function loadMyRelics() {

    relicsContainer.innerHTML =
        "<p class='submission-text'>LOADING RELICS...</p>";

    const response = await fetch(
        "/api/submit-relic",
        {
            method: "GET",

            headers: {
                Authorization:
                    `Bearer ${creatorPiAuth.accessToken}`
            },

            cache: "no-store"
        }
    );

    const result = await response.json();

    if (!response.ok) {
        throw new Error(
            result.error ||
            "Could not load relics"
        );
    }

    if (!result.relics?.length) {

        relicsContainer.innerHTML =
            "<p class='submission-text'>NO RELICS FOUND.</p>";

        return;
    }

    relicsContainer.innerHTML = "";

    const totalTrackSales =
    result.relics.reduce(
        (sum, relic) =>
            sum + Number(relic.track_sales || 0),
        0
    );

const totalGrossPi =
    result.relics.reduce(
        (sum, relic) =>
            sum + Number(relic.gross_pi || 0),
        0
    );

const totalArtistPi =
    result.relics.reduce(
        (sum, relic) =>
            sum + Number(relic.pi_earned || 0),
        0
    );

const totalOssvariumFeePi =
    result.relics.reduce(
        (sum, relic) =>
            sum + Number(relic.ossvarium_fee_pi || 0),
        0
    );

const earningsDashboard =
    document.createElement("div");

earningsDashboard.className =
    "my-relic-card";

earningsDashboard.innerHTML = `
    <h2>☠ CREATOR EARNINGS ☠</h2>

    <p>
    TOTAL RELICS:
    <strong>${result.relics?.length || 0}</strong>
</p>

    <p>
        TOTAL TRACK SALES:
        <strong>${totalTrackSales}</strong>
    </p>

    <p>
        GROSS SALES:
        <strong>${totalGrossPi.toFixed(4)} Pi</strong>
    </p>

    <p>
        YOUR SHARE (90%):
        <strong>${totalArtistPi.toFixed(4)} Pi</strong>
    </p>

    <p>
        OSSVARIUM FEE (10%):
        <strong>${totalOssvariumFeePi.toFixed(4)} Pi</strong>
    </p>

    <p>
    PAYOUT PENDING:
    <strong>
        ${Number(result.earnings?.pending_payout_pi || 0).toFixed(4)} Pi
    </strong>
</p>

    <p>
    PAID OUT:
    <strong>
        ${Number(result.earnings?.paid_out_pi || 0).toFixed(4)} Pi
    </strong>
</p>

<p>
    AVAILABLE BALANCE:
    <strong>
        ${Number(result.earnings?.available_balance_pi || 0).toFixed(4)} Pi
    </strong>
</p>

<button
    type="button"
    id="requestPayoutButton"
    class="submit-btn"
>
    π REQUEST PAYOUT
</button>

<div
    id="payoutStatus"
    class="submission-text"
></div>

`;

relicsContainer.appendChild(
    earningsDashboard
);

const payoutHistory =
    Array.isArray(result.payout_history)
        ? result.payout_history
        : [];

if (payoutHistory.length > 0) {
    const payoutHistorySection =
        document.createElement("div");

    payoutHistorySection.className =
        "submission-card";

    payoutHistorySection.innerHTML = `
        <h2>☠ PAYOUT HISTORY ☠</h2>

        ${payoutHistory.map(payout => {
            const amount =
                Number(payout.amount_pi || 0).toFixed(4);

            const status =
                String(payout.status || "").toUpperCase();

            const dateValue =
                payout.completed_at ||
                payout.created_at;

            const date = dateValue
                ? new Date(dateValue).toLocaleDateString()
                : "-";

            return `
                <p>
                    <strong>${amount} Pi</strong>
                    — ${status}
                    <br>
                    ${date}
                </p>
            `;
        }).join("")}
    `;

    relicsContainer.appendChild(
        payoutHistorySection
    );
} 

const salesHistory =
    Array.isArray(result.sales_history)
        ? result.sales_history
        : [];

if (salesHistory.length > 0) {
    const salesHistorySection =
        document.createElement("div");

    salesHistorySection.className =
        "submission-card";

    salesHistorySection.innerHTML = `
        <h2>☠ SALES HISTORY ☠</h2>

        ${salesHistory.map(sale => {
            const gross =
                Number(sale.amount_pi || 0).toFixed(4);

            const artistShare =
                Number(sale.artist_share_pi || 0).toFixed(4);

            const ossvariumFee =
                Number(sale.ossvarium_fee_pi || 0).toFixed(4);

            const date =
                sale.created_at
                    ? new Date(
                        sale.created_at
                    ).toLocaleDateString()
                    : "-";

            return `
                <p>
                    <strong>${sale.track_title || "Unknown Track"}</strong>
                    <br>
                    ${sale.artist || ""} — ${sale.release_title || ""}
                    <br>
                    ${sale.relic_id || ""}
                    <br>
                    SALE: <strong>${gross} Pi</strong>
                    <br>
                    YOUR SHARE (90%):
                    <strong>${artistShare} Pi</strong>
                    <br>
                    OSSVARIUM FEE (10%):
                    ${ossvariumFee} Pi
                    <br>
                    ${date}
                </p>
            `;
        }).join("")}
    `;

    relicsContainer.appendChild(
        salesHistorySection
    );
}

const requestPayoutButton =
    document.getElementById(
        "requestPayoutButton"
    );

const payoutStatus =
    document.getElementById(
        "payoutStatus"
    );

    const availableBalance =
    Number(
        result.earnings?.available_balance_pi || 0
    );

const pendingPayout =
    Number(
        result.earnings?.pending_payout_pi || 0
    );

if (
    availableBalance <= 0 &&
    pendingPayout > 0
) {
    requestPayoutButton.disabled = false;

    requestPayoutButton.textContent =
        "π COMPLETE PENDING PAYOUT";

    payoutStatus.textContent =
        `${pendingPayout.toFixed(4)} Pi AWAITING PAYOUT`;
}

if (
    availableBalance <= 0 &&
    pendingPayout <= 0
) {
    requestPayoutButton.disabled = true;

    requestPayoutButton.textContent =
        "π NO BALANCE AVAILABLE";

    payoutStatus.textContent =
        "NO PAYOUT AVAILABLE";
}

requestPayoutButton.addEventListener(
    "click",
    async function () {

        try {

            requestPayoutButton.disabled = true;

            requestPayoutButton.textContent =
                "π REQUESTING...";

            payoutStatus.textContent =
                "";

            const response = await fetch(
                "/api/submit-relic",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        Authorization:
                            `Bearer ${creatorPiAuth.accessToken}`
                    },

                    body: JSON.stringify({
                        action: "request_payout"
                    })
                }
            );

            const result =
                await response.json();

            if (!response.ok) {
                throw new Error(
                    result.error ||
                    "Payout request failed"
                );
            }

            payoutStatus.textContent =
                `PAYOUT REQUESTED: ${
                    Number(
                        result.payout.amount_pi
                    ).toFixed(4)
                } Pi`;

            requestPayoutButton.textContent =
                "π PAYOUT PENDING";

        } catch (error) {

            console.error(
                "OSSVARIUM payout request error:",
                error
            );

            payoutStatus.textContent =
                error.message;

            requestPayoutButton.disabled =
                false;

            requestPayoutButton.textContent =
                "π REQUEST PAYOUT";
        }
    }
);

    result.relics.forEach(function (relic) {

        const card =
            document.createElement("div");

        card.className =
            "my-relic-card";

        card.innerHTML = `
            <h2>${relic.artist}</h2>

            <h3>${relic.release_title}</h3>

            <p>
                ${relic.relic_id}
            </p>

            <p>
                STATUS:
                <strong>
                    ${String(relic.status).toUpperCase()}
                </strong>
            </p>

            <p>
    TRACK SALES:
    <strong>
        ${relic.track_sales || 0}
    </strong>
</p>

<p>
    π EARNED:
    <strong>
        ${Number(relic.pi_earned || 0).toFixed(4)} Pi
    </strong>
</p>

<a
    href="release.html?id=${encodeURIComponent(relic.relic_id)}"
    class="submit-btn"
>
    ⚔ VIEW RELIC
</a>
        `;

        relicsContainer.appendChild(card);
    });
}

    </script>

</body>

</html>
