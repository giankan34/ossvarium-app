<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OSSVARIUM Storage Test</title>
</head>

<body>

    <h2>OSSVARIUM PRIVATE AUDIO TEST</h2>

    <input
        type="file"
        id="audioFile"
        accept=".mp3,audio/mpeg"
    >

    <button id="uploadBtn">
        UPLOAD TEST MP3
    </button>

    <pre id="result"></pre>

    <script>

        const uploadBtn =
            document.getElementById("uploadBtn");

        const audioFile =
            document.getElementById("audioFile");

        const result =
            document.getElementById("result");

        uploadBtn.addEventListener(
            "click",
            async () => {

                const file =
                    audioFile.files[0];

                if (!file) {
                    alert("Choose an MP3 first.");
                    return;
                }

                result.textContent =
                    "Creating secure upload...";

                try {

                    const response =
                        await fetch(
                            "/api/audio-upload-url",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    fileName: file.name,
                                    contentType:
                                        "audio/mpeg"
                                })
                            }
                        );

                    const data =
                        await response.json();

                    if (!response.ok) {
                        throw new Error(
                            data.error ||
                            "Could not create upload URL"
                        );
                    }

                    result.textContent =
                        "Uploading MP3...";

                    const uploadResponse =
                        await fetch(
                            data.uploadUrl,
                            {
                                method: "PUT",

                                headers: {
                                    "Content-Type":
                                        "audio/mpeg"
                                },

                                body: file
                            }
                        );

                    if (!uploadResponse.ok) {
                        throw new Error(
                            "MP3 upload failed"
                        );
                    }

                    result.textContent =
                        "☠ PRIVATE AUDIO UPLOADED ☠\n\n" +
                        data.objectKey;

                } catch (error) {

                    console.error(error);

                    result.textContent =
                        "ERROR: " + error.message;
                }
            }
        );

    </script>

</body>
</html>
