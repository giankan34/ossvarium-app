<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Relics Awaiting Judgement | OSSVARIUM</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=UnifrakturMaguntia&display=swap"
          rel="stylesheet">

</head>

<body>

    <div
    id="adminGate"
    class="submission-page"
>
    <section class="submission-box">

        <h1>☠ OSSVARIUM ADMIN ☠</h1>

        <p class="submission-text">
            RESTRICTED ARCHIVE ACCESS
        </p>

        <input
            type="password"
            id="adminPassword"
            placeholder="ENTER ADMIN KEY"
            autocomplete="off"
        >

        <br><br>

        <button
            type="button"
            class="submit-btn"
            onclick="unlockAdmin()"
        >
            ⚔ ENTER THE ARCHIVES ⚔
        </button>

        <p
            id="adminError"
            class="submission-text"
            style="display:none;"
        >
            ☠ ACCESS DENIED ☠
        </p>

    </section>
</div>

    <main class="submission-page">

        <main
    class="submission-page"
    id="adminContent"
    style="display:none;"
>

            <h1>
                ☠ RELICS AWAITING JUDGEMENT ☠
            </h1>

            <p class="submission-text">
                Submitted relics awaiting approval
                into the OSSVARIUM archives.
            </p>

            <div id="pendingRelics"></div>

            <a href="index.html"
               class="back-link">

                ← RETURN TO OSSVARIUM

            </a>

        </section>

    </main>

    <script src="admin-reviews.js"></script>

</body>

</html>
