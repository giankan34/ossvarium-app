<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>OSSVARIUM — Relic Verification</title>

<link
href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="verify.css">

</head>

<body>

<div class="verify-container">

    <h1>RELIC VERIFICATION</h1>

    <p>
        Enter an OSSVARIUM Relic ID
        to verify its Archive record.
    </p>

    <div class="verify-form">

        <input
            type="text"
            id="relicInput"
            placeholder="OSV-00001">

        <button id="verifyBtn">
            VERIFY RELIC
        </button>

    </div>

    <div id="verifyResult"></div>

</div>

<script src="verify.js"></script>

</body>

</html>
